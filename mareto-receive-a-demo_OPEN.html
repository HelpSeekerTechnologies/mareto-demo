<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://demo.helpseeker.org/mareto-receive-a-demo_OPEN.html">
<title>Receive a Demo — Mareto</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --hs-navy:#0B1F33;--hs-muted:#4A5568;--hs-page:#F9FAFB;
  --hs-action-gradient:linear-gradient(135deg,#0B1F33 22%,#336FB5 100%);
  --hs-radius-control:999px;
  --sh1:0 2px 12px rgba(11,31,51,.06);--sh2:0 4px 18px rgba(11,31,51,.10),0 1px 3px rgba(11,31,51,.05);
  --nv-tap:44px;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',-apple-system,BlinkMacSystemFont,sans-serif;color:#2D3748;line-height:1.6;background:var(--hs-page);-webkit-font-smoothing:antialiased}
.quiz-container{max-width:720px;margin:0 auto;padding:24px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.landing{text-align:center;padding:60px 24px;animation:fadeIn .5s ease}
.landing img{height:44px;margin-bottom:28px}
.landing h1{font-size:clamp(26px,4vw,38px);font-weight:700;color:var(--hs-navy);line-height:1.2;margin-bottom:12px}
.landing p.subtitle{font-size:16px;color:var(--hs-muted);max-width:480px;margin:0 auto 32px}
.landing .start-btn{display:inline-flex;align-items:center;gap:8px;background:var(--hs-action-gradient);color:#fff;font-size:16px;font-weight:700;font-family:'Lato',sans-serif;padding:16px 36px;border-radius:var(--hs-radius-control);border:none;cursor:pointer;transition:all .2s;box-shadow:var(--sh1);min-height:var(--nv-tap);text-decoration:none}
.landing .start-btn:hover{box-shadow:var(--sh2)}
.landing .start-btn svg{width:18px;height:18px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){
  .quiz-container{padding:16px}
  .landing{padding:40px 16px}
}
</style>
</head>
<body>

<div class="quiz-container">
  <div class="landing">
    <img src="https://images.squarespace-cdn.com/content/v1/69438d79db205639aca92b96/d4184cfc-e432-40a9-83ac-64eeec9d4dc4/PB_Mareto+Logo-01.png?format=1500w" alt="Mareto">
    <h1>See Mareto in action</h1>
    <p class="subtitle">Walk through an interactive demo built around real programs and real workflows. No sign-up needed.</p>
    <a href="mareto-interactive-demo.html?unlocked&seat=manager" class="start-btn">Open the demo <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
  </div>
</div>

</body>
</html>
